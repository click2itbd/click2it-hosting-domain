<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WAPlus Hosting CRM</title>
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0B1121;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 12px;
    }
    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #25D366, #128C7E);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
      color: white;
    }
    .title h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      color: white;
    }
    .title p {
      margin: 0;
      font-size: 11px;
      color: #94a3b8;
    }
    .status-card {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .status-row:last-child {
      margin-bottom: 0;
    }
    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #4ade80;
      font-weight: 600;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
    }
    .btn {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      color: white;
    }
    .btn-whatsapp {
      background: #25D366;
      color: #0f172a;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .footer {
      font-size: 10px;
      text-align: center;
      color: #64748b;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">&lt;&gt;</div>
    <div class="title">
      <h3>InHost WAPlus CRM</h3>
      <p>WhatsApp Web Integration</p>
    </div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span style="color: #94a3b8;">Portal API</span>
      <span class="status-indicator"><span class="dot"></span> Connected</span>
    </div>
    <div class="status-row">
      <span style="color: #94a3b8;">Multi-Agent Team</span>
      <span style="color: #38bdf8; font-weight: 600;">4 Agents Online</span>
    </div>
    <div class="status-row">
      <span style="color: #94a3b8;">WhatsApp Web Dock</span>
      <span style="color: #e2e8f0; font-weight: 500;">Active</span>
    </div>
  </div>

  <a href="https://web.whatsapp.com" target="_blank" class="btn btn-whatsapp">
    📱 Open WhatsApp Web
  </a>

  <a href="http://localhost:3000/admin" target="_blank" class="btn btn-primary">
    ⚡ Open Portal CRM Workspace
  </a>

  <div class="footer">
    Version 1.0.0 • Connected to InHostBilling
  </div>
</body>
</html>
